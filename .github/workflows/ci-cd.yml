name: Backend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build backend
        run: npm run build

      - name: Verify production server starts
        env:
          DATABASE_URL: mysql://user:password@127.0.0.1:3306/lms
          PORT: 3100
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3100/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            prisma/
            src/generated/
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
